<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Pomodoro</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glitch-overlay"></div>
    <div class="container">
        <div class="header">
            <h1 class="glitch" data-text="CYBER_POMODORO">CYBER_POMODORO</h1>
        </div>

        <div class="mode-selector">
            <button id="btn-work" class="btn-mode active">WORK_MODE</button>
            <button id="btn-break" class="btn-mode">BREAK_MODE</button>
        </div>

        <div class="timer-display">
            <div class="tomato-progress-container">
                <!-- Silhouette Layer -->
                <svg class="tomato-svg tomato-silhouette" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="neon-glow-bg" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    <g filter="url(#neon-glow-bg)">
                        <!-- Tomato Body (Holographic/Dim) -->
                        <path d="M100,50 C160,50 180,80 180,120 C180,160 150,190 100,190 C50,190 20,160 20,120 C20,80 40,50 100,50 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
                        <!-- Grid lines -->
                        <path d="M25,120 L175,120 M50,70 L50,170 M150,70 L150,170 M100,50 L100,190" stroke="currentColor" stroke-width="1" opacity="0.1"/>
                        <!-- Stem -->
                        <path d="M100,50 L90,20 L100,35 L110,20 Z" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
                        <path d="M70,40 L100,50 L130,40" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
                    </g>
                </svg>

                <!-- Fill Layer -->
                <svg class="tomato-svg tomato-fill" id="tomato-fill-layer" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="neon-glow-fill" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="8" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    <g filter="url(#neon-glow-fill)">
                        <!-- Tomato Body (Filled) -->
                        <path d="M100,50 C160,50 180,80 180,120 C180,160 150,190 100,190 C50,190 20,160 20,120 C20,80 40,50 100,50 Z" fill="currentColor" opacity="0.7"/>
                        <!-- Inner Cyber Highlights -->
                        <path d="M40,120 A60,60 0 0,0 100,180" fill="none" stroke="#fff" stroke-width="4" opacity="0.8"/>
                        <!-- Stem -->
                        <path d="M100,50 L90,20 L100,35 L110,20 Z" fill="#00f0ff" stroke="#00f0ff" stroke-width="2"/>
                        <path d="M70,40 L100,50 L130,40" fill="none" stroke="#00f0ff" stroke-width="3"/>
                    </g>
                </svg>

                <!-- Timer Overlay -->
                <div id="time" class="time-text neon-text small-timer">25:00</div>
            </div>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn-control neon-button">START</button>
            <button id="btn-pause" class="btn-control neon-button">PAUSE</button>
            <button id="btn-reset" class="btn-control neon-button">RESET</button>
        </div>

        <div class="pomodoro-tracker">
            <div id="tomato-container"></div>
            <div class="tracker-label">COMPLETED_CYCLES</div>
        </div>

        <div class="status-bar">
            <span id="status-text">STATUS: IDLE</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
